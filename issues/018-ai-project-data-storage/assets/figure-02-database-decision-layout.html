<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>SQLite 与 PostgreSQL 的选择</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:1200px;height:760px;overflow:hidden;background:#fdfdfb}body{font-family:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei",Arial,sans-serif;color:#191b1c}svg{display:block;width:1200px;height:760px}</style>
</head><body>
<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SQLite 适合单实例和少量并发写入，PostgreSQL 适合多实例共享和并发写入">
  <text x="92" y="79" font-size="15" font-weight="600" letter-spacing="2" fill="#777b7d">02 / 选择</text>
  <text x="92" y="122" font-size="29" font-weight="700" fill="#191b1c">数据库的边界，不是一个固定的用户人数</text>
  <path d="M92 151H1108" stroke="#d7d9d8" stroke-width="1"/>
  <path d="M600 197V674" stroke="#d7d9d8" stroke-width="1"/>

  <!-- SQLite：一个应用与一个本地文件 -->
  <text x="115" y="224" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#191b1c">SQLite</text>
  <text x="115" y="253" font-size="15" fill="#777b7d">应用与数据在同一实例</text>
  <g transform="translate(162 310)">
    <rect x="0" y="0" width="142" height="126" fill="#fdfdfb" stroke="#191b1c" stroke-width="1.8"/>
    <path d="M26 43l19 18-19 18M58 79h43" fill="none" stroke="#777b7d" stroke-width="2.7" stroke-linecap="square"/>
    <text x="71" y="107" text-anchor="middle" font-size="12" letter-spacing="1.5" fill="#8b8e90">APP</text>
  </g>
  <path d="M304 373h83" stroke="#191b1c" stroke-width="1.5"/>
  <g transform="translate(401 303)">
    <path d="M0 0h91l20 20v131H0Z" fill="#fdfdfb" stroke="#191b1c" stroke-width="1.8"/>
    <path d="M91 0v20h20" fill="none" stroke="#191b1c" stroke-width="1.8"/>
    <ellipse cx="55" cy="52" rx="31" ry="9" fill="#f3f2ee" stroke="#777b7d" stroke-width="1.2"/>
    <path d="M24 52v38c0 6 14 10 31 10s31-4 31-10V52" fill="none" stroke="#777b7d" stroke-width="1.2"/>
    <text x="55" y="128" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#777b7d">data.db</text>
  </g>
  <path d="M115 512H515" stroke="#d7d9d8" stroke-width="1"/>
  <text x="115" y="553" font-size="17" font-weight="600" fill="#191b1c">同一台机器 · 单个应用实例</text>
  <text x="115" y="588" font-size="16" fill="#777b7d">读取很多也没关系，写入需要依次完成</text>
  <text x="115" y="623" font-size="16" fill="#777b7d">数据库文件必须进入持久目录并单独备份</text>

  <!-- PostgreSQL：多个应用共享独立服务 -->
  <text x="684" y="224" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#191b1c">PostgreSQL</text>
  <text x="684" y="253" font-size="15" fill="#777b7d">多个应用实例共享一套数据服务</text>
  <g transform="translate(690 294)">
    <rect x="0" y="0" width="116" height="92" fill="#fdfdfb" stroke="#191b1c" stroke-width="1.7"/>
    <path d="M21 31l15 14-15 14M47 59h34" fill="none" stroke="#777b7d" stroke-width="2.3"/>
    <text x="58" y="78" text-anchor="middle" font-size="10" letter-spacing="1.3" fill="#8b8e90">APP 01</text>
    <rect x="0" y="127" width="116" height="92" fill="#fdfdfb" stroke="#191b1c" stroke-width="1.7"/>
    <path d="M21 158l15 14-15 14M47 186h34" fill="none" stroke="#777b7d" stroke-width="2.3"/>
    <text x="58" y="205" text-anchor="middle" font-size="10" letter-spacing="1.3" fill="#8b8e90">APP 02</text>
  </g>
  <path d="M806 340h94M806 467h94M900 340v127M900 404h75" fill="none" stroke="#191b1c" stroke-width="1.5"/>
  <g transform="translate(985 323)">
    <ellipse cx="55" cy="13" rx="55" ry="13" fill="#f3f2ee" stroke="#191b1c" stroke-width="1.8"/>
    <path d="M0 13v115c0 9 25 16 55 16s55-7 55-16V13" fill="#fdfdfb" stroke="#191b1c" stroke-width="1.8"/>
    <path d="M0 50c0 9 25 16 55 16s55-7 55-16M0 88c0 9 25 16 55 16s55-7 55-16" fill="none" stroke="#aeb3b4" stroke-width="1.3"/>
    <text x="55" y="171" text-anchor="middle" font-size="12" letter-spacing="1.5" fill="#8b8e90">DB SERVICE</text>
  </g>
  <path d="M684 553H1085" stroke="#d7d9d8" stroke-width="1"/>
  <text x="684" y="594" font-size="17" font-weight="600" fill="#191b1c">多实例共享 · 较多并发写入</text>
  <text x="684" y="629" font-size="16" fill="#777b7d">独立服务负责连接、事务、权限和并发</text>
  <text x="684" y="664" font-size="16" fill="#777b7d">优先托管，避免过早承担数据库运维</text>
</svg>
</body></html>
