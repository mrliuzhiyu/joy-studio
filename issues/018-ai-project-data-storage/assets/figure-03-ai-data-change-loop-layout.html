<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>AI 数据变更安全闭环</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:1200px;height:800px;overflow:hidden;background:#fdfdfb}body{font-family:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei",Arial,sans-serif;color:#191b1c}svg{display:block;width:1200px;height:800px}</style>
</head><body>
<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI 写迁移，在隔离数据库验证，通过权限闸门进入生产，失败则返回修改">
  <text x="92" y="79" font-size="15" font-weight="600" letter-spacing="2" fill="#777b7d">03 / 变更</text>
  <text x="92" y="122" font-size="29" font-weight="700" fill="#191b1c">AI 可以写迁移，但不能直接拥有生产数据库</text>
  <path d="M92 151H1108" stroke="#d7d9d8" stroke-width="1"/>

  <path d="M149 350H1045" stroke="#191b1c" stroke-width="1.6"/>
  <g transform="translate(1045 350)"><path d="M0-6l10 6-10 6" fill="none" stroke="#191b1c" stroke-width="1.6"/></g>

  <!-- 迁移文件 -->
  <g transform="translate(110 231)">
    <path d="M0 0h112l23 23v133H0Z" fill="#fdfdfb" stroke="#191b1c" stroke-width="1.8"/>
    <path d="M112 0v23h23" fill="none" stroke="#191b1c" stroke-width="1.8"/>
    <text x="18" y="50" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#191b1c">001.sql</text>
    <path d="M18 75h78M18 96h61M18 117h84" stroke="#b9bdbc" stroke-width="4"/>
  </g>
  <text x="178" y="425" text-anchor="middle" font-size="18" font-weight="600" fill="#191b1c">迁移进入仓库</text>
  <text x="178" y="454" text-anchor="middle" font-size="14" fill="#777b7d">AI 生成，可审查</text>

  <!-- 隔离数据库 -->
  <g transform="translate(342 262)">
    <ellipse cx="64" cy="15" rx="64" ry="15" fill="#f3f2ee" stroke="#191b1c" stroke-width="1.8"/>
    <path d="M0 15v92c0 10 29 18 64 18s64-8 64-18V15" fill="#fdfdfb" stroke="#191b1c" stroke-width="1.8"/>
    <path d="M0 48c0 10 29 18 64 18s64-8 64-18M0 80c0 10 29 18 64 18s64-8 64-18" fill="none" stroke="#aeb3b4" stroke-width="1.3"/>
    <text x="64" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.2" fill="#777b7d">STAGING</text>
  </g>
  <text x="406" y="425" text-anchor="middle" font-size="18" font-weight="600" fill="#191b1c">隔离环境升级</text>
  <text x="406" y="454" text-anchor="middle" font-size="14" fill="#777b7d">从上一版结构开始</text>

  <!-- 检查清单 -->
  <g transform="translate(573 244)">
    <path d="M0 0h145v141H0Z" fill="#fdfdfb" stroke="#191b1c" stroke-width="1.8"/>
    <g fill="none" stroke="#777b7d" stroke-width="1.4"><rect x="20" y="26" width="14" height="14"/><rect x="20" y="61" width="14" height="14"/><rect x="20" y="96" width="14" height="14"/></g>
    <g fill="none" stroke="#191b1c" stroke-width="1.6"><path d="M23 32l4 4 9-10"/><path d="M23 67l4 4 9-10"/><path d="M23 102l4 4 9-10"/></g>
    <path d="M50 33h70M50 68h54M50 103h77" stroke="#b9bdbc" stroke-width="4"/>
  </g>
  <text x="646" y="425" text-anchor="middle" font-size="18" font-weight="600" fill="#191b1c">自动验收</text>
  <text x="646" y="454" text-anchor="middle" font-size="14" fill="#777b7d">约束 · 行数 · 查询 · 耗时</text>

  <!-- 权限闸门 -->
  <g transform="translate(805 218)">
    <path d="M0 0v198M70 0v198" stroke="#191b1c" stroke-width="2"/>
    <path d="M0 36h70M0 76h70M0 116h70M0 156h70" stroke="#d2d4d3" stroke-width="1"/>
    <circle cx="35" cy="94" r="18" fill="#fdfdfb" stroke="#191b1c" stroke-width="1.7"/>
    <circle cx="35" cy="89" r="4" fill="#191b1c"/>
    <path d="M35 93v11" stroke="#191b1c" stroke-width="2"/>
  </g>
  <text x="840" y="454" text-anchor="middle" font-size="18" font-weight="600" fill="#191b1c">生产权限</text>
  <text x="840" y="483" text-anchor="middle" font-size="14" fill="#777b7d">检查通过后按次释放</text>

  <!-- 生产数据库 -->
  <g transform="translate(972 258)">
    <ellipse cx="64" cy="15" rx="64" ry="15" fill="#f3f2ee" stroke="#191b1c" stroke-width="2"/>
    <path d="M0 15v96c0 10 29 18 64 18s64-8 64-18V15" fill="#fdfdfb" stroke="#191b1c" stroke-width="2"/>
    <path d="M0 49c0 10 29 18 64 18s64-8 64-18M0 83c0 10 29 18 64 18s64-8 64-18" fill="none" stroke="#aeb3b4" stroke-width="1.3"/>
    <text x="64" y="68" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.2" fill="#777b7d">PRODUCTION</text>
  </g>
  <text x="1036" y="425" text-anchor="middle" font-size="18" font-weight="600" fill="#191b1c">生产数据库</text>
  <text x="1036" y="454" text-anchor="middle" font-size="14" fill="#777b7d">运行账号保持低权限</text>

  <!-- 失败证据返回，不使用彩色警示 -->
  <path d="M646 385v171H178V387" fill="none" stroke="#8b8e90" stroke-width="1.4" stroke-dasharray="5 6"/>
  <rect x="421" y="520" width="231" height="73" fill="#f3f2ee"/>
  <path d="M444 557h33l12-20 19 34 17-26h38" fill="none" stroke="#777b7d" stroke-width="1.8"/>
  <text x="537" y="624" text-anchor="middle" font-size="17" font-weight="600" fill="#191b1c">失败证据返回下一次修改</text>

  <path d="M92 686H1108" stroke="#d7d9d8" stroke-width="1"/>
  <text x="92" y="727" font-size="15" fill="#777b7d">破坏性操作额外确认；不可逆变化先验证备份与恢复。</text>
</svg>
</body></html>
