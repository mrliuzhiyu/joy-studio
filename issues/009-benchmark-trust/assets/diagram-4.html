<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#fffdf8; font-family:'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif; }
  .fig { width:880px; background:#fffdf8; padding:44px 48px; }
  .tnum { font-family:'Futura','Helvetica Neue',Arial,sans-serif; font-size:30px; font-weight:700; color:#1a1a1a; border-top:6px solid #1a1a1a; display:inline-block; padding-top:6px; line-height:1; }
  .title { font-size:26px; font-weight:700; color:#1a1a1a; margin:16px 0 30px; }
  .cols { display:flex; gap:18px; align-items:stretch; }
  .col { flex:1; border-radius:8px; padding:22px; }
  .col h3 { margin:0 0 16px; font-size:17px; }
  .left { background:#f1f5ef; border:1px solid #d8e3d2; }
  .left h3 { color:#3f6b3a; }
  .right { background:#f7efe8; border:1px solid #e8d8c8; }
  .right h3 { color:#9a5a2a; }
  .tag { display:inline-block; margin:0 6px 8px 0; padding:6px 12px; border-radius:6px; font-size:14px; }
  .left .tag { background:#e3eede; color:#3f6b3a; }
  .right .tag { background:#efe0d2; color:#8a5326; }
  .vs { align-self:center; font-size:18px; color:#9a8f78; font-weight:700; }
  .callout { margin-top:26px; padding:18px 22px; background:#f7ece9; border-left:5px solid #b2402a; font-size:17px; color:#1a1a1a; }
  .callout b { color:#b2402a; }
  .foot { margin-top:24px; font-size:13px; color:#a99c82; }
</style></head>
<body>
  <div class="fig" id="fig">
