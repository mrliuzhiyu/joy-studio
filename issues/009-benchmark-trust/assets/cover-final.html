<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#fffdf8; font-family:'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif; }
  .cover { width:900px; height:383px; background:linear-gradient(135deg,#faf7f0 0%,#f0e9dc 100%); position:relative; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .accent { position:absolute; left:0; top:0; bottom:0; width:12px; background:#b8860b; }
  .badge { position:absolute; top:30px; right:40px; font-size:18px; color:#b8860b; border:2px solid #b8860b; border-radius:999px; padding:5px 16px; font-weight:600; }
  .kicker { font-size:21px; color:#b8860b; font-weight:600; letter-spacing:2px; margin-bottom:14px; }
  .title { font-size:54px; font-weight:800; color:#1a1a1a; line-height:1.2; text-align:center; letter-spacing:1px; }
  .title .em { color:#b8860b; }
  .sub { margin-top:18px; font-size:22px; color:#555; font-weight:500; }
  .foot { position:absolute; bottom:22px; left:0; right:0; text-align:center; font-size:16px; color:#999; letter-spacing:1px; }
</style></head>
<body>
  <div class="cover">
    <div class="accent"></div>
    <div class="badge">榜单失信</div>
    <div class="kicker">第 009 期 · 模型评测</div>
    <div class="title">最有名的 AI 编程榜<br>作者自己<span class="em">停用了</span></div>
    <div class="sub">屠榜的分数，和你的真实代码是两回事</div>
    <div class="foot">刘志宇 Joy · AI 观察</div>
  </div>
</body></html>
