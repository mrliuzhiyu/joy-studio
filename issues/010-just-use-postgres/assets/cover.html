<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#fff; font-family:'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif; }
  .cover { width:900px; height:383px; background:#fafafa; position:relative; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .pgicon { width:54px; height:54px; display:block; margin-bottom:16px; }
  .kicker { font-size:20px; color:#888; font-weight:600; letter-spacing:2px; margin-bottom:14px; }
  .title { font-size:52px; font-weight:800; color:#1a1a1a; line-height:1.2; text-align:center; letter-spacing:1px; }
  .title .em { color:#1a1a1a; text-decoration:underline; text-decoration-thickness:3px; text-underline-offset:7px; }
  .sub { margin-top:20px; font-size:21px; color:#666; font-weight:500; }
  .foot { position:absolute; bottom:22px; left:0; right:0; text-align:center; font-size:16px; color:#aaa; letter-spacing:1px; }
</style></head>
<body>
  <div class="cover">
    <img class="pgicon" src="pg-icon.svg" alt="PostgreSQL">
    <div class="kicker">第 010 期 · AI 工程</div>
    <div class="title">向量数据库火了两年<br>又搬回了 <span class="em">Postgres</span></div>
    <div class="sub">够用之前，先别急着上专门的向量库</div>
    <div class="foot">刘志宇 Joy · AI 观察</div>
  </div>
</body></html>
