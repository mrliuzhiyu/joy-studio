<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#fff; font-family:'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif; }
  .fig { width:880px; background:#fff; padding:44px 48px; }
  .tnum { font-family:'Futura','Helvetica Neue',Arial,sans-serif; font-size:30px; font-weight:700; color:#1a1a1a; border-top:6px solid #1a1a1a; display:inline-block; padding-top:6px; line-height:1; }
  .title { font-size:26px; font-weight:700; color:#1a1a1a; margin:16px 0 30px; }
  .cols { display:flex; gap:18px; align-items:stretch; }
  .col { flex:1; border:1.5px solid #e0e0e0; border-radius:10px; padding:20px 20px 18px; background:#fcfcfc; display:flex; flex-direction:column; }
  .lab { font-size:15px; font-weight:700; color:#888; margin-bottom:16px; }
  .node { padding:11px 14px; border-radius:8px; font-size:15px; font-weight:600; text-align:center; }
  .n-app { background:#1a1a1a; color:#fff; }
  .n-db { background:#ececec; color:#444; }
  .n-pg { background:#1a1a1a; color:#fff; line-height:1.35; }
  .down { text-align:center; color:#bbb; font-size:20px; line-height:1.1; margin:7px 0; }
  .two { display:flex; gap:12px; }
  .two .node { flex:1; }
  .sync { text-align:center; font-size:13px; color:#555; font-weight:700; margin:9px 0; }
  .risk { margin-top:auto; background:#f2f2f2; border-left:5px solid #888; padding:11px 14px; font-size:13.5px; color:#666; line-height:1.5; }
  .good { margin-top:auto; background:#f4f4f4; border-left:5px solid #1a1a1a; padding:11px 14px; font-size:13.5px; color:#1a1a1a; line-height:1.5; }
  .sql { font-family:'SFMono-Regular',Consolas,monospace; font-size:12.5px; }
  .foot { margin-top:28px; font-size:13px; color:#a5a5a5; }
</style></head>
<body>
  <div class="fig" id="fig">
    <div class="tnum">02</div>
    <div class="title">两套系统要对账，一个库一条 SQL 查完</div>
    <div class="cols">
      <div class="col">
        <div class="lab">专用向量库方案</div>
        <div class="node n-app">你的应用</div>
        <div class="down">▼</div>
        <div class="two">
          <div class="node n-db">主数据库<br>原文 · 权限</div>
          <div class="node n-db">向量库<br>向量</div>
        </div>
        <div class="sync">↔ 还要自己同步 / 对账</div>
        <div class="risk">对账掉链子：删掉的文档还能被搜到，或查到一条改过的旧内容。</div>
      </div>
      <div class="col">
        <div class="lab">Postgres 方案</div>
        <div class="node n-app">你的应用</div>
        <div class="down">▼</div>
        <div class="node n-pg">Postgres<br>原文 · 元数据 · 向量 同一张表</div>
        <div class="down">▼</div>
        <div class="good"><span class="sql">一条 SQL：按权限过滤 → 相似度排序 → join 取标题</span></div>
      </div>
    </div>
    <div class="foot">图 2 · 两套系统要对账 vs 一个库搞定 · 来源:Encore</div>
  </div>
</body></html>
