<svg xmlns="http://www.w3.org/2000/svg" width="640" height="900" viewBox="0 0 640 900">
  <g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" fill="#111827">
    <text x="30" y="46" font-size="18" letter-spacing="2" fill="#6b7280">界面边界</text>
    <text x="30" y="88" font-size="34" font-weight="700">有些界面稳定，有些只为任务出现</text>
    <line x1="30" y1="112" x2="610" y2="112" stroke="#111827" stroke-width="2"/>

    <rect x="30" y="148" width="580" height="292" rx="10" fill="none" stroke="#9ca3af" stroke-width="3"/>
    <g transform="translate(65 192)" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="-23" y="-18" width="46" height="36" rx="4"/><line x1="-23" y1="-6" x2="23" y2="-6"/><line x1="-13" y1="3" x2="-13" y2="10"/><line x1="0" y1="3" x2="0" y2="10"/><line x1="13" y1="3" x2="13" y2="10"/></g>
    <text x="105" y="201" font-size="26" font-weight="700">稳定界面</text>
    <text x="62" y="236" font-size="18" fill="#6b7280">长期存在，建立熟悉感和操作习惯</text>
    <line x1="62" y1="258" x2="578" y2="258" stroke="#d1d5db" stroke-width="2"/>
    <text x="62" y="298" font-size="20">编辑器与精细操作</text>
    <text x="62" y="337" font-size="20">批量管理与持续监控</text>
    <text x="62" y="376" font-size="20">权限、账单、历史与审计</text>
    <g transform="translate(75 411)" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -13 L11 -8 L9 5 C7 13,0 17,0 17 C0 17,-7 13,-9 5 L-11 -8 Z"/></g>
    <text x="98" y="418" font-size="20">高风险动作的固定确认</text>

    <rect x="30" y="476" width="580" height="292" rx="10" fill="none" stroke="#9ca3af" stroke-width="3"/>
    <g transform="translate(65 520)" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -19 L6 -6 L20 0 L6 6 L0 19 L-6 6 L-20 0 L-6 -6 Z"/><path d="M22 -18 L24 -12 L30 -10 L24 -8 L22 -2 L20 -8 L14 -10 L20 -12 Z"/></g>
    <text x="105" y="529" font-size="26" font-weight="700">任务界面</text>
    <text x="62" y="564" font-size="18" fill="#6b7280">按当前目标出现，完成后可以消失</text>
    <line x1="62" y1="586" x2="578" y2="586" stroke="#d1d5db" stroke-width="2"/>
    <text x="62" y="626" font-size="20">多方案比较与差异视图</text>
    <text x="62" y="665" font-size="20">跨系统信息的临时汇总</text>
    <text x="62" y="704" font-size="20">一次性配置与预览</text>
    <g transform="translate(75 739)" fill="none" stroke="#16a34a" stroke-width="3" stroke-linejoin="round"><rect x="-12" y="-12" width="24" height="24" rx="3"/><path d="M-5 0 L0 5 L8 -5"/></g>
    <text x="98" y="746" font-size="20">由可信组件生成，不是任意网页</text>

    <text x="30" y="817" font-size="19" font-weight="700">判断标准</text>
    <text x="30" y="851" font-size="17" fill="#4b5563">越高频、精细、持续、高风险，越稳定。</text>
    <text x="30" y="879" font-size="13" fill="#9ca3af">图 3 · 稳定界面与任务界面的边界 · 本文整理</text>
  </g>
</svg>
