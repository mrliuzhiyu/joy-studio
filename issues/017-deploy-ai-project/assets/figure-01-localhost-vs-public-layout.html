<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>localhost 指向当前设备</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:750px;overflow:hidden;background:#fff}
body{font-family:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei",Arial,sans-serif;color:#182027}
.figure{width:1200px;height:750px;background:linear-gradient(180deg,#fff 0%,#fff 74%,#f7f9fa 100%)}
svg{display:block;width:1200px;height:750px}
</style>
</head>
<body>
<main class="figure">
<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="同一个 localhost 地址在两台电脑上分别回到各自本机">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#55788b"/>
    </marker>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#9aa9b1" flood-opacity=".12"/>
    </filter>
  </defs>

  <text x="600" y="74" text-anchor="middle" font-size="22" font-weight="600" letter-spacing="2" fill="#74808a">LOCALHOST 总是回到正在访问它的设备</text>

  <!-- 开发者设备 -->
  <g transform="translate(80 148)">
    <text x="230" y="0" text-anchor="middle" font-size="28" font-weight="700" fill="#182027">你的电脑</text>
    <g transform="translate(0 36)" filter="url(#soft)">
      <rect x="0" y="0" width="460" height="300" rx="18" fill="#fff" stroke="#182027" stroke-width="3"/>
      <rect x="18" y="18" width="424" height="246" rx="9" fill="#fbfcfc" stroke="#d9e1e5" stroke-width="2"/>
      <path d="M18 68h424" stroke="#d9e1e5" stroke-width="2"/>
      <circle cx="39" cy="43" r="5" fill="#9cabb3"/><circle cx="58" cy="43" r="5" fill="#c4cfd4"/><circle cx="77" cy="43" r="5" fill="#dde4e7"/>
      <rect x="103" y="29" width="255" height="29" rx="14.5" fill="#eef3f5"/>
      <text x="230" y="50" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#435966">localhost:3000</text>

      <rect x="55" y="102" width="172" height="112" rx="8" fill="#fff" stroke="#b9c8cf" stroke-width="2"/>
      <path d="M55 128h172" stroke="#d9e1e5" stroke-width="2"/>
      <circle cx="72" cy="115" r="3" fill="#718995"/><circle cx="83" cy="115" r="3" fill="#b6c5cc"/>
      <rect x="74" y="150" width="84" height="10" rx="5" fill="#dce7eb"/>
      <rect x="74" y="174" width="118" height="8" rx="4" fill="#edf2f4"/>
      <rect x="74" y="192" width="92" height="8" rx="4" fill="#edf2f4"/>

      <g transform="translate(286 102)">
        <rect x="0" y="0" width="108" height="112" rx="10" fill="#edf3f6" stroke="#55788b" stroke-width="2.5"/>
        <rect x="20" y="19" width="68" height="30" rx="5" fill="#fff" stroke="#55788b" stroke-width="2"/>
        <path d="M28 35h12l7-10 12 20 8-12h13" fill="none" stroke="#55788b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M22 69h64M22 84h45" stroke="#c4d1d7" stroke-width="7" stroke-linecap="round"/>
        <circle cx="86" cy="91" r="5" fill="#55788b"/>
        <text x="54" y="136" text-anchor="middle" font-size="18" font-weight="700" fill="#55788b">项目进程</text>
      </g>
      <path d="M227 158h59" fill="none" stroke="#55788b" stroke-width="3" marker-end="url(#arrow)"/>
      <path d="M0 300h460l-38 34H38Z" fill="#fff" stroke="#182027" stroke-width="3" stroke-linejoin="round"/>
      <path d="M174 317h112" stroke="#d9e1e5" stroke-width="3" stroke-linecap="round"/>
    </g>
    <path d="M72 424C13 424 13 519 72 519h315c59 0 59-95 0-95" fill="none" stroke="#55788b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text x="230" y="503" text-anchor="middle" font-size="20" fill="#55788b">请求留在本机</text>
  </g>

  <!-- 地址被发给另一台设备，但 localhost 的含义没有跟过去 -->
  <g transform="translate(539 305)">
    <path d="M0 0h120" fill="none" stroke="#b8c5cb" stroke-width="2.5" stroke-dasharray="8 10" marker-end="url(#arrow)"/>
    <rect x="15" y="-42" width="91" height="30" rx="15" fill="#fff" stroke="#d3dde2" stroke-width="1.5"/>
    <text x="60" y="-21" text-anchor="middle" font-size="15" fill="#7b888f">发送地址</text>
  </g>

  <!-- 朋友设备 -->
  <g transform="translate(660 148)">
    <text x="230" y="0" text-anchor="middle" font-size="28" font-weight="700" fill="#182027">朋友的电脑</text>
    <g transform="translate(0 36)" filter="url(#soft)">
      <rect x="0" y="0" width="460" height="300" rx="18" fill="#fff" stroke="#182027" stroke-width="3"/>
      <rect x="18" y="18" width="424" height="246" rx="9" fill="#fbfcfc" stroke="#d9e1e5" stroke-width="2"/>
      <path d="M18 68h424" stroke="#d9e1e5" stroke-width="2"/>
      <circle cx="39" cy="43" r="5" fill="#9cabb3"/><circle cx="58" cy="43" r="5" fill="#c4cfd4"/><circle cx="77" cy="43" r="5" fill="#dde4e7"/>
      <rect x="103" y="29" width="255" height="29" rx="14.5" fill="#eef3f5"/>
      <text x="230" y="50" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#435966">localhost:3000</text>

      <circle cx="230" cy="157" r="54" fill="#fff" stroke="#c9d3d8" stroke-width="2.5"/>
      <path d="M210 137l40 40M250 137l-40 40" stroke="#9aa9b1" stroke-width="4" stroke-linecap="round"/>
      <text x="230" y="237" text-anchor="middle" font-size="18" fill="#7b888f">3000 端口没有项目</text>
      <path d="M0 300h460l-38 34H38Z" fill="#fff" stroke="#182027" stroke-width="3" stroke-linejoin="round"/>
      <path d="M174 317h112" stroke="#d9e1e5" stroke-width="3" stroke-linecap="round"/>
    </g>
    <path d="M72 424C13 424 13 519 72 519h315c59 0 59-95 0-95" fill="none" stroke="#aebcc3" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text x="230" y="503" text-anchor="middle" font-size="20" fill="#7b888f">同样回到他的本机</text>
  </g>
</svg>
</main>
</body>
</html>
